name: Build APK

# Builds the app in the cloud on every push, so it can be made and updated
# without a laptop.
#  - vinayaka-utsav.apk : shared by link; the app's update pop-up points here
#  - vinayaka-utsav.aab : for Google Play (built when the UPLOAD_* secrets exist)
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUILD_NO: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check Firebase config
        run: |
          if [ ! -f lib/firebase_options.dart ]; then
            echo "::error::lib/firebase_options.dart is missing - add your Firebase project config first."
            exit 1
          fi

      - name: Create Android project files
        run: flutter create . --org com.vinayakautsav --project-name vinayaka_utsav --platforms android

      - name: Android settings (min SDK, app name, signing)
        run: python3 ci/patch_android.py

      - name: Use fixed signing key for the shared APK (so updates install over the old app)
        run: mkdir -p ~/.android && cp ci/debug.keystore ~/.android/debug.keystore

      - run: flutter pub get

      - name: App icon
        run: dart run flutter_launcher_icons

      # Each step below also reports its errors as a build annotation, so
      # they are readable from the run summary.
      - name: Analyze code
        run: |
          status=0
          flutter analyze --no-fatal-infos --no-fatal-warnings > out.txt 2>&1 || status=$?
          cat out.txt
          if [ $status -ne 0 ]; then
            msg=$(grep -E "error •" out.txt | head -40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=analyze::$msg"
          fi
          exit $status

      - name: Run tests
        run: |
          status=0
          flutter test > out.txt 2>&1 || status=$?
          cat out.txt
          if [ $status -ne 0 ]; then
            msg=$(grep -iE "error|expected|actual|fail" out.txt | head -30 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=test::$msg"
          fi
          exit $status

      - name: Build APK
        run: |
          status=0
          flutter build apk --release --build-number=$BUILD_NO --build-name=1.0.$BUILD_NO \
            --dart-define=CHANNEL=github > out.txt 2>&1 || status=$?
          cat out.txt
          if [ $status -ne 0 ]; then
            msg=$(grep -E -A4 "error:|Error:|What went wrong|FAILURE" out.txt | head -50 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=build::$msg"
          fi
          exit $status
          
      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk vinayaka-utsav.apk

      - name: Build Play Store bundle (AAB)
        # A Play-bundle problem must not stop the APK release.
        continue-on-error: true
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
        run: |
          missing=""
          [ -z "$UPLOAD_KEYSTORE_BASE64" ] && missing="$missing [keystore-file]"
          [ -z "$UPLOAD_STORE_PASSWORD" ] && missing="$missing [store-password]"
          if [ -n "$missing" ]; then
            echo "::notice title=aab::Play Store bundle skipped - missing secrets:$missing"
            exit 0
          fi
          # Tolerate spaces / line breaks picked up while copy-pasting the secret.
          if ! printf '%s' "$UPLOAD_KEYSTORE_BASE64" | tr -d ' \r\n\t' | base64 -d > "$RUNNER_TEMP/upload.jks" 2>/dev/null; then
            echo "::error title=aab::The keystore-file secret is not valid - copy the whole long line again."
            exit 1
          fi
          export UPLOAD_KEYSTORE_PATH="$RUNNER_TEMP/upload.jks"
          export UPLOAD_STORE_PASSWORD=$(printf '%s' "$UPLOAD_STORE_PASSWORD" | tr -d ' \r\n\t')
          export UPLOAD_KEY_PASSWORD="$UPLOAD_STORE_PASSWORD"   # PKCS12 keys use the store password
          export UPLOAD_KEY_ALIAS=upload   # the alias is not secret; fixed value avoids copy-paste mistakes
          if ! keytool -list -keystore "$UPLOAD_KEYSTORE_PATH" -storepass "$UPLOAD_STORE_PASSWORD" -alias "$UPLOAD_KEY_ALIAS" > /dev/null 2>&1; then
            if keytool -list -keystore "$UPLOAD_KEYSTORE_PATH" -storepass "$UPLOAD_STORE_PASSWORD" > /dev/null 2>&1; then
              echo "::error title=aab::Password is correct but the key-alias secret is wrong (it must be the word: upload)."
            else
              echo "::error title=aab::Key check failed. password length ${#UPLOAD_STORE_PASSWORD} (expected 20), check $(printf "%s" "$UPLOAD_STORE_PASSWORD" | sha256sum | cut -c1-6); key file $(stat -c %s "$UPLOAD_KEYSTORE_PATH") bytes, fingerprint $(sha256sum "$UPLOAD_KEYSTORE_PATH" | cut -c1-12)."
            fi
            exit 1
          fi
          status=0
          flutter build appbundle --release --build-number=$BUILD_NO --build-name=1.0.$BUILD_NO \
            --dart-define=CHANNEL=play > out.txt 2>&1 || status=$?
          cat out.txt
          if [ $status -ne 0 ]; then
            msg=$(grep -E -A4 "error:|Error:|What went wrong|FAILURE" out.txt | head -50 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=aab::$msg"
            exit $status
          fi
          cp build/app/outputs/bundle/release/app-release.aab vinayaka-utsav.aab

      - uses: actions/upload-artifact@v4
        with:
          name: vinayaka-utsav-build-${{ github.run_number }}
          path: |
            vinayaka-utsav.apk
            vinayaka-utsav.aab
          if-no-files-found: ignore

      - name: Release notes
        env:
          MSG: ${{ github.event.head_commit.message }}
        run: |
          first=$(printf '%s\n' "${MSG:-Manual build}" | head -n1)
          printf "What's new: %s\n\nDownload vinayaka-utsav.apk below and install it on Android.\n" "$first" > notes.md

      - name: Publish as a Release (download from phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Vinayaka Utsav app - build ${{ github.run_number }}
          body_path: notes.md
          files: |
            vinayaka-utsav.apk
            vinayaka-utsav.aab
          fail_on_unmatched_files: false

  # iPhone build check (unsigned). Proves the app compiles for iOS; signing and
  # TestFlight upload are added once an Apple Developer account exists.
  build-ios:
    runs-on: macos-latest
    env:
      BUILD_NO: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create iOS project files
        run: flutter create . --org com.vinayakautsav --project-name vinayaka_utsav --platforms ios

      - name: iOS settings (name, permissions, minimum iOS)
        run: |
          P=ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Delete :CFBundleDisplayName" "$P" || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string Vinayaka Utsav" "$P"
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string Attach payment screenshots and bills." "$P" || true
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string Take a photo of a bill or receipt." "$P" || true
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$P" || true
          flutter pub get
          if [ -f ios/Podfile ]; then
            sed -i '' "s/^# *platform :ios.*/platform :ios, '15.0'/" ios/Podfile
            grep -n "platform :ios" ios/Podfile || true
          fi
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g' ios/Runner.xcodeproj/project.pbxproj

      - name: App icon
        run: dart run flutter_launcher_icons -f ci/launcher_icons_ios.yaml

      - name: Build iOS (no signing)
        run: |
          status=0
          flutter build ios --release --no-codesign --build-number=$BUILD_NO --build-name=1.0.$BUILD_NO \
            --dart-define=CHANNEL=appstore > out.txt 2>&1 || status=$?
          cat out.txt
          if [ $status -ne 0 ]; then
            msg=$(grep -E -B2 -A6 "error:|Error:|Failed|failed" out.txt | head -60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=ios::$msg"
          fi
          exit $status
