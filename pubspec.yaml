name: vinayaka_utsav
description: Vinayaka Chaturthi committee app - activities, pooja seva sign-up, expenses and contributions.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  image_picker: ^1.1.2
  image: ^4.2.0
  intl: ^0.19.0
  google_fonts: ^6.2.1
  pdf: ^3.11.1
  printing: ^5.13.4
  package_info_plus: ^8.1.0
  url_launcher: ^6.3.1
  in_app_update: ^4.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#7A1F1F"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  min_sdk_android: 23
